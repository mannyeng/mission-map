<style>
:root{--bg:#f6f4ef;--fg:#1f2430;--muted:#6b7280;--card:#fff;--accent:#c2410c;--bd:#e3dfd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--fg:#eceae4;--muted:#9aa1ad;--card:#1d222b;--accent:#fb923c;--bd:#2b313c}}
:root[data-theme="dark"]{--bg:#14171d;--fg:#eceae4;--muted:#9aa1ad;--card:#1d222b;--accent:#fb923c;--bd:#2b313c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
img.logo{width:56px;height:56px;flex:none;border-radius:50%;background:#fff}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--muted);margin:2px 0 12px}
.stats{display:flex;gap:16px;margin-bottom:10px;font-weight:600}
.stats span b{color:var(--accent);font-size:1.3rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1;min-width:200px;margin:0}
#msg{color:var(--muted);font-size:.85rem;margin:-4px 0 8px;min-height:1.2em}
#map{height:68vh;min-height:420px;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#dbe8f2}
.mk{position:relative;width:26px;height:26px}
.mk svg{position:absolute;left:0;top:0;width:26px;height:26px;filter:drop-shadow(0 0 2px #fff)}
.mk span{position:absolute;left:20px;top:-8px;font:800 12px system-ui,sans-serif;color:#1f2430;background:#fff;border:1.5px solid #c2410c;border-radius:9px;padding:0 5px;white-space:nowrap}
#panel{margin-top:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
#panel.hide{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted);flex:1;min-width:150px}
input{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);margin-top:3px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{display:flex;gap:8px;margin-top:12px}
.hint{color:var(--muted);font-size:.85rem;margin-top:8px}
</style>
</head>

  <h1>Dallas Mission Map</h1>
</header>
<p class="sub">Search a city, suburb or street address, or click the map to mark where a mission took place. Zoom in for streets and neighborhoods.</p>
<div class="stats"><span><b id="tPins">0</b> places</span><span><b id="tCount">0</b> people reached</span></div>
<div class="tools">
  <input id="q" placeholder="Search a city, suburb or address (e.g. 100 Main St, Lewisville, TX)">
  <button class="primary" id="find">Find &amp; pin</button>
</div>
<div id="msg"></div>
<div id="map"></div>
<div id="panel" class="hide">
  <div class="row">
    <label>Place name<input id="name" placeholder="e.g. Plano, TX" maxlength="60"></label>
    <label>People touched<input id="count" type="number" min="0" inputmode="numeric" placeholder="0"></label>
  </div>
  <div class="actions">
    <button class="primary" id="save">Save</button>
    <button id="del" style="display:none">Delete</button>
    <button id="cancel">Cancel</button>
  </div>
  <div class="hint" id="coords"></div>
</div>
<p class="hint">Pins are saved in this browser. Tip: after searching, zoom in and click the exact spot to fine-tune the pin.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var $=function(id){return document.getElementById(id)};
var msg=function(t,bad){var e=$('msg');e.textContent=t;e.style.color=bad?'var(--accent)':'var(--muted)';e.style.fontWeight=bad?'600':'400'};

if(typeof L==='undefined'){
  $('map').innerHTML='<p style="padding:16px">The map could not load. Check your internet connection and reload.</p>';
}else{
var map=L.map('map',{worldCopyJump:true,minZoom:2}).setView([32.7767,-96.797],10);
var tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
tiles.on('tileerror',function(){if(!window._tileWarned){window._tileWarned=1;msg('Map tiles are not loading here (the preview may block them). They normally load on your published site.',true)}});

var pins=[],cur=null,KEY='mission-pins-v1',markers={},temp=null;
try{pins=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){pins=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(pins))}catch(e){}}

var PLUS='<svg viewBox="0 0 26 26"><path d="M13 3v20M3 13h20" stroke="#c2410c" stroke-width="5" stroke-linecap="round"/></svg>';
function iconFor(p){return L.divIcon({className:'',html:'<div class="mk">'+PLUS+'<span>'+(+p.count||0)+'</span></div>',iconSize:[26,26],iconAnchor:[13,13]})}
function render(){
  Object.keys(markers).forEach(function(id){map.removeLayer(markers[id]);delete markers[id]});
  pins.forEach(function(p){
    var m=L.marker([p.lat,p.lon],{icon:iconFor(p),title:(p.name||'Mission')+': '+p.count+' people'}).addTo(map);
    m.on('click',function(){openEdit(p)});
    markers[p.id]=m;
  });
  $('tPins').textContent=pins.length;
  $('tCount').textContent=pins.reduce(function(a,p){return a+(+p.count||0)},0).toLocaleString();
}
function setTemp(lat,lon){
  if(temp)map.removeLayer(temp);
  temp=L.circleMarker([lat,lon],{radius:10,color:'#c2410c',weight:2,dashArray:'4 3',fill:false,interactive:false}).addTo(map);
}
function show(){$('panel').classList.remove('hide')}
function close(){$('panel').classList.add('hide');if(temp){map.removeLayer(temp);temp=null}cur=null}
function openNew(lat,lon,label,note){
  cur={id:null,lat:lat,lon:lon};setTemp(lat,lon);
  $('name').value=label||'';$('count').value='';$('del').style.display='none';
  $('coords').textContent='New spot at '+lat.toFixed(5)+'°, '+lon.toFixed(5)+'° '+(note||'');
  show();$('count').focus();
}
function openEdit(p){
  cur=p;if(temp){map.removeLayer(temp);temp=null}
  $('name').value=p.name||'';$('count').value=p.count;$('del').style.display='';
  $('coords').textContent='Editing spot at '+p.lat.toFixed(5)+'°, '+p.lon.toFixed(5)+'°';
  show();
}
map.on('click',function(e){openNew(e.latlng.lat,e.latlng.lng,'','(from map click)')});
$('save').onclick=function(){
  if(!cur)return;
  var n=Math.max(0,parseInt($('count').value,10)||0),nm=$('name').value.trim();
  if(cur.id===null){cur.id=Date.now()+'-'+Math.random().toString(36).slice(2,6);pins.push(cur)}
  cur.name=nm;cur.count=n;persist();close();render();
};
$('del').onclick=function(){pins=pins.filter(function(p){return p!==cur});persist();close();render()};
$('cancel').onclick=close;
render();

var GAZ=[
["downtown dallas",32.7767,-96.797,15],["deep ellum",32.7839,-96.7836,15],["oak cliff",32.7412,-96.8286,14],["highland park",32.8337,-96.7924,14],["university park",32.8501,-96.7992,14],
["dallas",32.7767,-96.797,11],["fort worth",32.7555,-97.3308,11],["plano",33.0198,-96.6989,12],["frisco",33.1507,-96.8236,12],["mckinney",33.1972,-96.6398,12],["allen",33.1032,-96.6706,13],["richardson",32.9483,-96.7299,12],["garland",32.9126,-96.6389,12],["irving",32.814,-96.9489,12],["arlington",32.7357,-97.1081,12],["grand prairie",32.7459,-96.9978,12],["mesquite",32.7668,-96.5992,12],["carrollton",32.9537,-96.8903,12],["lewisville",33.0462,-96.9942,12],["denton",33.2148,-97.1331,12],["flower mound",33.0146,-97.097,12],["mansfield",32.5632,-97.1417,12],["rowlett",32.9029,-96.5639,13],["desoto",32.5899,-96.857,13],["duncanville",32.6518,-96.9083,13],["cedar hill",32.5885,-96.9561,13],["lancaster",32.5921,-96.7561,13],["coppell",32.9546,-97.015,13],["grapevine",32.9343,-97.0781,13],["southlake",32.9412,-97.1342,13],["keller",32.9346,-97.2517,13],["euless",32.837,-97.082,13],["bedford",32.844,-97.1431,13],["addison",32.9618,-96.8292,13],["farmers branch",32.9265,-96.8961,13],["the colony",33.0807,-96.8928,13],["little elm",33.1626,-96.9375,13],["prosper",33.2362,-96.8011,13],["wylie",33.0151,-96.5389,13],["sachse",32.9776,-96.5953,13],["murphy",33.0151,-96.6131,13],["rockwall",32.9312,-96.4597,13],

["delhi",28.6139,77.209,10],["mumbai",19.076,72.8777,10],["bangkok",13.7563,100.5018,10],["manila",14.5995,120.9842,10],["jakarta",-6.2088,106.8456,10],["seoul",37.5665,126.978,10],["tokyo",35.6762,139.6503,10],["sydney",-33.8688,151.2093,10]
];
var NORM=function(t){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9\- ]+/g,' ').replace(/\s+/g,' ').trim()};
function gazLookup(q){
  var n=' '+NORM(q)+' ',best=null;
  GAZ.forEach(function(g){if(n.indexOf(' '+g[0]+' ')>=0&&(!best||g[0].length>best[0].length))best=g});
  return best;
}
async function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'})},ms)})])}

async function geocode(q){
  var tried=[];
  try{ // 1) OpenStreetMap address search
    var u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q);
    var res=await withTimeout(fetch(u,{headers:{'Accept':'application/json'}}),8000);
    var j=await res.json();
    if(j&&j[0]){var t=j[0],bb=t.boundingbox&&t.boundingbox.map(Number);
      return{lat:+t.lat,lon:+t.lon,label:t.display_name.split(',').slice(0,3).join(',').trim(),acc:'address match',bb:bb};}
    tried.push('address search found nothing');
  }catch(e){tried.push('address search unreachable')}
  try{ // 2) Ask Claude (only works inside claude.ai)
    var sample=(typeof claude!=='undefined')?await claude.use('sample'):null;
    if(sample){
      var r=await withTimeout(sample.json('Geocode this place or address: '+JSON.stringify(q)+'. Reply ONLY with JSON: {"found":boolean,"lat":number,"lon":number,"label":"short place name, country","precision":"street"|"city"|"region"}. Use decimal degrees. If you are not confident, set found=false.',{cache:false}),25000);
      if(r&&r.found&&isFinite(r.lat)&&isFinite(r.lon)&&Math.abs(r.lat)<=90&&Math.abs(r.lon)<=180)
        return{lat:+r.lat,lon:+r.lon,label:r.label||q,acc:(r.precision||'approx.')+' estimate',zoom:r.precision==='street'?16:(r.precision==='city'?12:7)};
      tried.push('Claude could not place it');
    }
  }catch(e){tried.push('Claude lookup failed')}
  var g=gazLookup(q); // 3) built-in list
  if(g)return{lat:g[1],lon:g[2],label:g[0].replace(/\b\w/g,function(c){return c.toUpperCase()}),acc:'city centre (street not located)',zoom:g[3]};
  return{error:tried.join('; ')};
}
function pinAt(r){
  if(r.bb&&r.bb.length===4)map.fitBounds([[r.bb[0],r.bb[2]],[r.bb[1],r.bb[3]]],{maxZoom:18});
  else map.setView([r.lat,r.lon],r.zoom||14);
  openNew(r.lat,r.lon,r.label,'('+r.acc+')');
}
$('find').onclick=async function(){
  var q=$('q').value.trim();
  if(!q){msg('Type a city, suburb or address first.',true);return}
  var m=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(m){var la=+m[1],lo=+m[2];
    if(Math.abs(la)<=90&&Math.abs(lo)<=180){map.setView([la,lo],17);openNew(la,lo,'','(from coordinates)');msg('Pinned by coordinates.');return}}
  $('find').disabled=true;msg('Looking up “'+q+'”…');
  try{
    var r=await geocode(q);
    if(r.error)msg('Could not locate “'+q+'” ('+r.error+'). Try adding the city and state, type "lat, lon", or click the map.',true);
    else{pinAt(r);msg('Found: '+r.label+' — '+r.acc+'. If the pin is off, click the exact spot on the map to move it.')}
  }catch(e){msg('Search failed: '+((e&&(e.message||e.code))||'unknown error'),true)}
  $('find').disabled=false;
};
$('q').addEventListener('keydown',function(e){if(e.key==='Enter')$('find').click()});
}
